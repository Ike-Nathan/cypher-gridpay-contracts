name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Stellar CLI
        run: curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh -s -- --dir ~/.cargo/bin

      - name: Cache Cargo registry and build artifacts (core)
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('core/Cargo.lock') }}

      - name: Cache Cargo registry and build artifacts (orchestrator)
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            orchestrator/target
          key: ${{ runner.os }}-cargo-orchestrator-${{ hashFiles('orchestrator/Cargo.lock') }}

      - name: Format Check
        run: |
          make fmt
          git diff --exit-code

      - name: Clippy Lints (core)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core

      - name: Clippy Lints (orchestrator)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: orchestrator

      - name: Build Contracts (core)
        run: make build
        working-directory: core

      - name: Build Contracts (orchestrator)
        run: make build
        working-directory: orchestrator

      - name: Check WASM Binary Sizes (core)
        run: make check-size
        working-directory: core

      - name: Run Tests (core)
        run: cargo test --workspace 2>&1 | tee test-output.txt
        working-directory: core

      - name: Budget Regression Gate (core)
        run: make budget-bench
        working-directory: core

      - name: Run Tests (orchestrator)
        run: cargo test --workspace 2>&1 | tee test-output.txt
        working-directory: orchestrator

      - name: Build WASM Target (core)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release
        working-directory: core

      - name: Build WASM Target (orchestrator)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release
        working-directory: orchestrator
